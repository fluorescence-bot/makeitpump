name: Build Windows exe

# Every push to main (i.e. every merged PR) builds RainMixer.exe and publishes it
# to the rolling "latest" GitHub Release, downloadable by anyone at
# https://github.com/<owner>/<repo>/releases/latest
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe
  cancel-in-progress: false  # never cancel between release delete and create

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: code/src/kawaii_gui

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Build frontend
      working-directory: code/src/kawaii_gui/web
      run: |
        npm ci
        npm run build

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Build exe
      run: >
        pyinstaller --noconfirm --clean --onefile --windowed
        --name RainMixer
        --add-data "web/dist;web/dist"
        --add-data "presets;presets"
        app.py

    # Same app with a console window: shows the Python/pywebview output and any
    # error, for when RainMixer.exe fails silently. Set PYWEBVIEW_LOG=debug first
    # for pywebview's own log.
    - name: Build debug exe (console)
      run: >
        pyinstaller --noconfirm --onefile --console
        --name RainMixer-debug
        --add-data "web/dist;web/dist"
        --add-data "presets;presets"
        app.py

    # Start the debug exe on the runner and print what it says, so a build that
    # crashes at startup shows up in the log (it doesn't fail the build).
    - name: Smoke test (run the debug exe for 40 s)
      continue-on-error: true
      shell: pwsh
      run: |
        $env:PYWEBVIEW_LOG = "debug"
        $p = Start-Process dist\RainMixer-debug.exe -PassThru `
          -RedirectStandardOutput smoke.out -RedirectStandardError smoke.err
        Start-Sleep 40
        if ($p.HasExited) { "EXITED with code $($p.ExitCode)" }
        else { "STILL RUNNING after 40 s (window up)"; Stop-Process -Id $p.Id -Force }
        Get-Content smoke.out, smoke.err

    - name: Upload workflow artifact
      uses: actions/upload-artifact@v5
      with:
        name: RainMixer-windows
        path: |
          code/src/kawaii_gui/dist/RainMixer.exe
          code/src/kawaii_gui/dist/RainMixer-debug.exe

    - name: Publish to the "latest" release
      if: github.ref == 'refs/heads/main'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        notes="Automatic build of ${GITHUB_SHA::7} from main ($(date -u +%Y-%m-%d)).

        Download RainMixer.exe and double-click it (Windows 10/11). Saved presets go in a
        presets/ folder next to the exe. If Windows SmartScreen warns, choose More info -> Run anyway.

        License: project code is MIT; the bundled ismatec-control pump driver is GPL-3, so this
        exe is distributed under GPL-3. Source: https://github.com/${GITHUB_REPOSITORY}"
        gh release delete latest --yes --cleanup-tag || true
        gh release create latest dist/RainMixer.exe dist/RainMixer-debug.exe \
          --title "RainMixer (latest build)" --notes "$notes" --target "$GITHUB_SHA" --latest
