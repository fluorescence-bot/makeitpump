<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Peristaltic pump and rotating cuvette holder</title>
  <rect width="512" height="512" rx="112" fill="#1E3A5F"/>

  <!-- Peristaltic pump: housing track, tube squeezed by rollers -->
  <path d="M 308 170 A 64 64 0 0 0 436 170" fill="none" stroke="#2C5079" stroke-width="22" stroke-linecap="round"/>
  <path d="M 424 52 L 424 170 A 52 52 0 0 1 320 170 L 320 120 C 320 70, 180 70, 180 196"
        fill="none" stroke="#4FD1C5" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#EEF3F7" stroke-width="8" stroke-linecap="round">
    <line x1="372" y1="170" x2="372" y2="208"/>
    <line x1="372" y1="170" x2="405" y2="151"/>
    <line x1="372" y1="170" x2="339" y2="151"/>
  </g>
  <g fill="#EEF3F7">
    <circle cx="372" cy="170" r="12"/>
    <circle cx="372" cy="208" r="12"/>
    <circle cx="405" cy="151" r="12"/>
    <circle cx="339" cy="151" r="12"/>
  </g>

  <!-- Rotation path, back half (behind the cylinder) -->
  <path d="M 68 370 A 112 30 0 0 1 292 370" fill="none" stroke="#F6C445" stroke-width="8" stroke-opacity="0.35"/>

  <!-- Cylinder -->
  <path d="M 100 300 L 100 420 A 80 24 0 0 0 260 420 L 260 300 Z" fill="#EEF3F7"/>
  <ellipse cx="180" cy="300" rx="80" ry="24" fill="#C3D2DF"/>

  <!-- Cuvette held in the top -->
  <rect x="150" y="170" width="60" height="132" rx="6" fill="#EEF3F7" fill-opacity="0.15" stroke="#EEF3F7" stroke-width="8"/>
  <rect x="158" y="236" width="44" height="58" rx="2" fill="#4FD1C5"/>

  <!-- Rotation path, front half with arrowhead -->
  <path d="M 68 370 A 112 30 0 0 0 292 370" fill="none" stroke="#F6C445" stroke-width="10" stroke-linecap="round"/>
  <path d="M 276 376 L 308 376 L 292 346 Z" fill="#F6C445"/>
</svg>
